<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dragonle</title>
  <meta name="description" content="Dragonle: a comic-retro pixel game about dragon eggs, young dragons, twelve elements and the politics of the sky.">
  <meta name="theme-color" content="#1b1024">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 14' shape-rendering='crispEdges'%3E%3Cpath d='M4 0h4v1h1v1h1v2h1v2h1v5h-1v2H9v1H3v-1H1v-2H0V6h1V4h1V2h1V1h1z' fill='%231b1024'/%3E%3Cpath d='M4 1h4v1h1v2h1v2h1v5h-1v1H9v1H3v-1H2v-1H1V6h1V4h1V2h1z' fill='%23ffd23f'/%3E%3Cpath d='M5 3h1v1h1v1H6v1H5z' fill='%23ff4d3d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3.7.3">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span data-icon="egg" data-scale="3"></span><span class="brand-name">DRAGONLE</span></div>
    <div class="stats">
      <span class="chip gold" title="Gold"><span data-icon="coin"></span><b id="gold">0</b></span>
      <span class="chip" title="Dragon School reputation – makes riddles clearer"><span data-icon="cap"></span><b id="schoolrep">0</b></span>
      <span class="chip ruler" id="ruler-chip" title="Ruling faction"></span>
      <span class="chip time" title="The year of the dragon world (1 year = 1 second of play)"><span data-icon="hourglass"></span><b id="played">0</b></span>
    </div>
    <div class="tools">
      <button class="tool" id="btn-anim" type="button" title="Animations: auto / full / short"></button>
      <button class="tool" id="btn-sound" type="button" title="Sound on/off"></button>
      <button class="tool" id="btn-story" type="button" title="The Chronicle of the Skies – factions, kings and their stories"></button>
      <button class="tool" id="btn-help" type="button" title="How to play"></button>
    </div>
  </header>

  <section class="sky-wrap" aria-label="Sky">
    <canvas id="sky" class="sky"></canvas>
    <div id="sky-info" class="sky-info"></div>
    <div id="tension" class="tension" hidden><span class="tension-label"></span><span class="tension-bar"><i></i></span></div>
  </section>

  <main id="view" class="view" tabindex="-1"></main>

  <aside id="herald" class="herald idle" hidden aria-live="polite" title="Click to hurry the speaker">
    <div class="hp"><img id="herald-img" alt=""></div>
    <div><div class="hn" id="herald-name"></div><div class="ht" id="herald-text"></div></div>
    <div class="hb"><button class="tool" id="herald-log" type="button" title="Court record"></button><button class="tool" id="herald-min" type="button" title="Shrink or expand the herald">–</button></div>
  </aside>

  <nav class="nav" aria-label="Areas">
    <button type="button" data-nav="world"><span data-icon="world" data-scale="3"></span>World</button>
    <button type="button" data-nav="school"><span data-icon="school" data-scale="3"></span>School</button>
    <button type="button" data-nav="nest"><span data-icon="nest" data-scale="3"></span>Nest</button>
    <button type="button" data-nav="market"><span data-icon="market" data-scale="3"></span>Market</button>
    <button type="button" data-nav="dragons"><span data-icon="dragons" data-scale="3"></span>Dragons</button>
    <button type="button" data-nav="factions"><span data-icon="factions" data-scale="3"></span>Factions</button>
    <button type="button" data-nav="bag"><span data-icon="bag" data-scale="3"></span>Bag</button>
    <button type="button" data-nav="log"><span data-icon="log" data-scale="3"></span>Log</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-x" type="button" aria-label="Close" data-act="closeModal">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="config.js?v=3.7.3"></script>
  <script src="core.js?v=3.7.3"></script>
  <script src="sprites.js?v=3.7.3"></script>
  <script src="voices.js?v=3.7.3"></script>
  <script src="quotes-1.js?v=3.7.3"></script>
  <script src="quotes-2.js?v=3.7.3"></script>
  <script src="court.js?v=3.7.3"></script>
  <script src="cinema.js?v=3.7.3"></script>
  <script src="ui.js?v=3.7.3"></script>
</body>
</html>
